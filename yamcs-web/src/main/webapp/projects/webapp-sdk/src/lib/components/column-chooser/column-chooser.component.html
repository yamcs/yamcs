<ya-button
  [matMenuTriggerFor]="colMenu"
  [appearance]="appearance()"
  [icon]="icon()"
  dropdown="true">
  Columns
</ya-button>

<mat-menu #colMenu="matMenu" yPosition="below" class="ya-menu" [overlapTrigger]="false">
  <ng-template matMenuContent>
    @for (entry of menuEntries; track entry.column) {
      @if (entry.divider) {
        <mat-divider />
      }
      <button mat-menu-item (click)="toggleColumn(entry.column)">
        <mat-icon>{{ isVisible(entry.column) ? "check" : "" }}</mat-icon>
        {{ entry.column.label }}
      </button>
    }
  </ng-template>
</mat-menu>
