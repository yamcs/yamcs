name: CI

on: [push, pull_request]

jobs:
  java:
    name: Java ${{ matrix.platform }} ${{ matrix.java }}
    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
        platform: [ubuntu-latest]
        mvn_opts: ["-Dsurefire.useFile=false"]
        experimental: [false]
        include:
          - platform: macos-latest
            java: "17"
            mvn_opts: "-Dsurefire.useFile=false"
            experimental: true
          - platform: windows-latest
            java: "17"
            mvn_opts: '"-Dsurefire.useFile=false"'
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Run test suite
        run: mvn -B --no-transfer-progress ${{ matrix.mvn_opts }} test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: errdump
          path: |
            yamcs-core/hs_err*
            yamcs-core/target/surefire-reports/*.dump*
            tests/hs_err*
            tests/target/surefire-reports/*.dump*

  javadoc:
    name: Javadoc ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Generate javadoc
        run: mvn -B --no-transfer-progress -DskipTests javadoc:aggregate

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Set up webapp
        run: cd yamcs-web/src/main/webapp; npm install
      - name: Build webapp
        run: cd yamcs-web/src/main/webapp; npm run build
      - name: Check formatting
        run: cd yamcs-web/src/main/webapp; npm run prettier:check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web-tests/pom.xml') }}
      - name: Build Yamcs
        run: mvn -B --no-transfer-progress -pl web-tests -am -DskipTests install
      # Playwright otherwise fetches every browser on first use (~1G). The tests
      # only drive Chromium, so install just that, and let the test run itself
      # work with what is already there.
      - name: Install Chromium
        run: mvn -B --no-transfer-progress -pl web-tests exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium"
      - name: Run web UI tests
        run: mvn -B --no-transfer-progress -Dsurefire.useFile=false -Dplaywright.skipBrowserDownload=1 -pl web-tests test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-test-results
          path: web-tests/target/surefire-reports/*

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Generate protobin
        run: mvn -B --no-transfer-progress -DskipTests compile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up sphinx
        run: |
          cd docs
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate HTTP API documentation
        run: |
          cd docs/http-api
          make html
      - name: Generate Server Manual
        run: |
          cd docs/server-manual
          make man html
