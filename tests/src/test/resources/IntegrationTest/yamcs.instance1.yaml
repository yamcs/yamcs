services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.archive.CcsdsTmIndex
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
        backFiller:
          automaticBackfilling: false
  - class: org.yamcs.ProcessorCreatorService
    args: 
      name: "realtime"
      type: "realtime"
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.timeline.TimelineService
  - class: org.yamcs.activities.triggers.TriggerService
    args:
      # Disabled here, enabled by ActivityTriggerIntegrationTest when needed
      triggers:
        - name: event-trigger
          enabled: false
          runAs: admin
          condition:
            alarm:
              type: EVENT
              subjects: IntegrationTest/Trigger-Test-1*
          policy:
            cooldown: 0
            concurrency: ALLOW
          activity:
            type: MANUAL
            args:
              name: Handle ${event.message} (${alarm.severity})
        - name: severity-trigger
          enabled: false
          condition:
            alarm:
              type: EVENT
              subjects: IntegrationTest/Trigger-Test-2*
              minSeverity: CRITICAL
          policy:
            cooldown: 0
          activity:
            type: MANUAL
            args:
              name: Stays running
        - name: confirm-trigger
          enabled: false
          condition:
            alarm:
              type: EVENT
              subjects: IntegrationTest/Trigger-Test-3
          policy:
            requireConfirmation: true
          activity:
            type: MANUAL
            args:
              name: Confirmed
        - name: parameter-trigger
          enabled: false
          condition:
            parameter:
              expression: /REFMDB/SUBSYS1/LocalPara1 > 10
          policy:
            cooldown: 0
            concurrency: ALLOW
          activity:
            type: MANUAL
            args:
              name: Value is ${value}
        - name: killswitch-trigger
          enabled: false
          condition:
            alarm:
              type: EVENT
              subjects: IntegrationTest/Trigger-Test-5*
          policy:
            cooldown: 0
            concurrency: ALLOW
          activity:
            type: MANUAL
            args:
              name: x
  - class: org.yamcs.parameter.ParameterRetrievalService
    args:
      parameterCache:
         enabled: true
         cacheAll: true
         duration: 3600
         maxNumEntries: 4096

dataLinks:
  - name: tm_realtime
    class: org.yamcs.tests.AbstractIntegrationTest$PacketProvider
    num: 0
    stream: tm_realtime
  - name: tm2_realtime
    class: org.yamcs.tests.AbstractIntegrationTest$PacketProvider
    num: 1
    stream: tm2_realtime
            
  - name: pp_realtime
    class: org.yamcs.tests.AbstractIntegrationTest$ParameterProvider
    stream: pp_realtime
    num: 0
  - name: tc_realtime
    class: org.yamcs.tests.AbstractIntegrationTest$TcDataLink
    num: 0
    stream: tc_realtime

mdb:
  - type: "sheet"
    args: 
      file: "mdb/refmdb.xls"
      enableAliasReferences: false
  - type: "xtce"    
    args:
      file: "mdb/writable_subsys.xml"
    writable: true
    
streamConfig:
  tm: 
   - name: tm_realtime
     processor: realtime
   - name: tm2_realtime
     processor: realtime
     rootContainer: /REFMDB/tm2
   - name: tm_dump
  cmdHist: ["cmdhist_realtime",  "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["sys_param", "pp_realtime", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  eventAlarm: ["event_alarms_realtime"]
  tc: 
    - name: "tc_realtime"
      processor: realtime
